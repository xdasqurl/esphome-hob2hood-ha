# ESPHome Secrets Configuration Example
# Copy this file to 'secrets.yaml' and update with your actual values
# DO NOT commit secrets.yaml to version control

# WiFi Configuration
wifi_ssid: "YourWiFiNetworkName"
wifi_password: "YourWiFiPassword"

# Optional: Additional WiFi network for failover
# wifi_ssid_backup: "GuestNetwork" 
# wifi_password_backup: "GuestPassword"

# ESPHome API Configuration
# Generate a new encryption key using: esphome dashboard -> device -> edit -> generate
api_encryption_key: "your_api_encryption_key_here"

# OTA (Over The Air) Update Password
# Choose a secure password for wireless firmware updates
ota_password: "your_secure_ota_password_here"

# Optional: MQTT Configuration (if using MQTT instead of native API)
# mqtt_broker: "192.168.1.100"
# mqtt_username: "esphome"
# mqtt_password: "mqtt_password"

# Optional: Static IP Configuration (recommended for reliability)
# static_ip: "192.168.1.150"
# gateway: "192.168.1.1"
# subnet: "255.255.255.0"
# dns1: "192.168.1.1"
# dns2: "8.8.8.8"

# Optional: Manual Timeout Configuration
# manual_mode_timeout: "10"  # seconds before returning to hob2hood mode

# Optional: Fallback Hotspot Configuration
# fallback_hotspot_password: "fallback_wifi_password"

# Device Specific Settings
# device_name: "athom-hob2hood"
# friendly_name: "Kitchen Hood Controller"